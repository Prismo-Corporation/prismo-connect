services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prismo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prismo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-prismo_connect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prismo} -d ${POSTGRES_DB:-prismo_connect}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
